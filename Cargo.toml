[workspace]
members = ["bench"]

[package]
name = "hledgers"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
description = "A Rust port of the hledger plain text accounting command-line tool"
publish = false

[dependencies]
dashu-int = { version = "0.6.2", default-features = false, features = ["std"] }
regex = "1.13"
unicode-width = { version = "0.2.3", default-features = false }

[dev-dependencies]
rayon = "1.12"
similar = "2.7"
tempfile = "3.27"

[[test]]
name = "shelltest"
harness = false
