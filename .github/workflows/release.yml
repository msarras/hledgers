# Pushing a version tag (v1.2.3) runs the CI checks, builds hledgers for each
# platform, runs each binary once, and publishes the archives as a GitHub
# release. Run by hand (Actions > release > Run workflow), it does all of
# that but publish, to try the platforms out.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # The Linux binaries are built in manylinux containers, against glibc 2.28,
    # so they run on distributions older than the runner's own.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm # free for public repositories only
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # build.rs needs hledger/ for the embedded documents
      - name: Install Rust (the containers have none)
        if: matrix.container
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Run the binary once
        if: matrix.target != 'x86_64-apple-darwin' # cross-built on an arm64 runner
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/hledgers
          [[ $RUNNER_OS == Windows ]] && bin=$bin.exe
          "$bin" --version
          "$bin" -f hledger/examples/sample.journal balancesheet
      - name: Package
        shell: bash
        run: |
          name=hledgers-$GITHUB_REF_NAME-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE "$name"
          if [[ $RUNNER_OS == Windows ]]; then
            cp target/${{ matrix.target }}/release/hledgers.exe "$name"
            7z a "$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/hledgers "$name"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            hledgers-*.tar.gz
            hledgers-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "hledgers $GITHUB_REF_NAME" --generate-notes *
